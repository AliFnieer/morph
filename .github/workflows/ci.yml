name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Fmt
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
